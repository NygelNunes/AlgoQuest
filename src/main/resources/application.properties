spring.application.name=algoquest
server.port=${ALGOQUEST_PORTA:8080}
spring.datasource.url=${ALGOQUEST_DB_URL:jdbc:h2:file:./data/algoquest;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${ALGOQUEST_DB_USUARIO:sa}
spring.datasource.password=${ALGOQUEST_DB_SENHA:}
spring.flyway.enabled=true
algoquest.cors.origens=${ALGOQUEST_CORS_ORIGENS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,http://127.0.0.1:3000}
algoquest.sessao.horas=${ALGOQUEST_SESSAO_HORAS:12}
algoquest.senha.iteracoes=${ALGOQUEST_SENHA_ITERACOES:600000}
algoquest.usuario-inicial.nome=${ALGOQUEST_USUARIO_INICIAL:}
algoquest.usuario-inicial.senha=${ALGOQUEST_SENHA_INICIAL:}
server.error.include-message=never
server.error.include-stacktrace=never
