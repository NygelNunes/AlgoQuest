services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: algoquest
      POSTGRES_USER: ${ALGOQUEST_DB_USUARIO:-postgres}
      POSTGRES_PASSWORD: ${ALGOQUEST_DB_SENHA:?defina ALGOQUEST_DB_SENHA no ambiente ou no .env}
    ports:
      - "5432:5432"
    volumes:
      - algoquest-dados:/var/lib/postgresql/data
volumes:
  algoquest-dados:
