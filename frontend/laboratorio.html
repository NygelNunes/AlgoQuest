<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#07080b"><link rel="preload" href="assets/fonts/unifrakturcook-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin><link rel="preload" href="assets/fonts/cinzel-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin><link rel="preload" href="assets/fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin><link rel="preload" href="assets/fonts/inter-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="css/assets.css"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/avatares.css"><link rel="stylesheet" href="css/tema.css"><script src="js/avatares-catalogo.js"></script><script src="js/tema.js"></script><link rel="stylesheet" href="css/lab.css"><link rel="stylesheet" href="css/fantasia.css"><title>AlgoQuest - Grimório Vivo</title></head>
<body class="pagina-app">
  <div class="app">
    <aside id="menu"></aside>
    <main class="conteudo" id="conteudo">
      <section class="lab superficie" aria-labelledby="labTitulo">
        <header class="lab__topo">
          <div>
            <h1 id="labTitulo"><i class="ic i-book-open" aria-hidden="true"></i>Grimório Vivo</h1>
            <p class="lore">Cada feitiço da computação, executado diante dos seus olhos. Avance passo a passo — ou aposte no próximo movimento.</p>
          </div>
        </header>
        <div class="lab__abas" id="abas" role="tablist" aria-label="Simulações"></div>

        <div class="lab__intro"><h2 id="simTitulo"></h2><p id="simResumo"></p><p class="lab__fato" id="simFato"></p></div>

        <form class="lab__entrada" id="entrada" novalidate>
          <div class="lab__campos" id="campos"></div>
          <div class="lab__botoes">
            <button class="btn btn--primario" type="submit">Executar</button>
            <button class="btn btn--fantasma" type="button" id="btnAleatorio">Sortear dados</button>
            <button class="btn btn--fantasma" type="button" id="btnManual" hidden>Ordenar à mão</button>
          </div>
          <p class="lab__erro" id="erroEntrada" role="alert" hidden></p>
        </form>

        <div class="lab__palco" id="palco" aria-label="Visualização da simulação"></div>
        <p class="lab__narra" id="narra" role="status" aria-live="polite"></p>

        <div class="lab__pergunta" id="pergunta" hidden aria-live="polite"></div>

        <div class="lab__controles" id="controles">
          <div class="lab__transporte">
            <button class="btn btn--fantasma btn--icone" id="btnInicio" type="button" aria-label="Voltar ao início" title="Início"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14M19 5L9 12l10 7z"/></svg></button>
            <button class="btn btn--fantasma btn--icone" id="btnAnt" type="button" aria-label="Passo anterior" title="Passo anterior"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
            <button class="btn btn--primario btn--icone" id="btnPlay" type="button" aria-label="Reproduzir" title="Reproduzir"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="p-play" d="M8 5l11 7-11 7z"/><path class="p-pause" d="M8 5v14M16 5v14"/></svg></button>
            <button class="btn btn--fantasma btn--icone" id="btnProx" type="button" aria-label="Próximo passo" title="Próximo passo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
          </div>
          <label class="lab__vel"><span>Velocidade</span><input id="velocidade" type="range" min="1" max="4" step="1" value="2"></label>
          <label class="lab__passo"><span id="passoRotulo">Passo 1 de 1</span><input id="linha" type="range" min="0" max="0" value="0" aria-label="Linha do tempo da simulação"></label>
          <button class="lab__desafio" id="btnDesafio" type="button" aria-pressed="false"><i class="ic i-swords" aria-hidden="true"></i><span>Modo Desafio</span></button>
        </div>

        <div class="lab__placar" id="placar" aria-label="Maestria"></div>
      </section>
    </main>
    <aside id="perfil" aria-label="Personagem"></aside>
  </div>
  <script src="js/api.js"></script><script src="js/arte.js"></script><script src="js/ui.js"></script><script src="js/avatares.js"></script><script src="js/lab-sims.js"></script><script src="js/lab.js"></script>
</body></html>
