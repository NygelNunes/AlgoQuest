      <form class="portal" id="formLogin" novalidate aria-labelledby="tituloLogin">
        <span class="portal__luz" aria-hidden="true"></span>
        <header class="portal__topo">
          <h1 id="tituloLogin">Entrar no Reino</h1>
          <p>Retome sua jornada de onde parou.</p>
        </header>
        <div class="campo" data-campo="usuario">
          <label for="usuario">Usuário</label>
          <div class="campo__caixa">
            <input id="usuario" name="usuario" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Seu nome de aventureiro" aria-describedby="erroUsuario" required></div>
          <p class="campo__erro" id="erroUsuario"></p>
        </div>
        <div class="campo" data-campo="senha">
          <label for="senha">Senha</label>
          <div class="campo__caixa">
            <input id="senha" name="senha" type="password" autocomplete="current-password" placeholder="Sua palavra secreta" aria-describedby="erroSenha avisoCaps" required>
            <button class="campo__olho" id="btnOlho" type="button" aria-label="Mostrar senha" aria-pressed="false"><i class="ic i-eye" aria-hidden="true"></i></button></div>
          <p class="campo__erro" id="erroSenha"></p>
          <p class="campo__aviso" id="avisoCaps" hidden><i class="ic i-triangle-alert" aria-hidden="true"></i>Caps Lock está ativado.</p>
        </div>
        <p class="alerta" id="erro" role="alert" hidden></p>
        <button class="btn btn--primario btn--bloco btn--grande" id="btnEntrar" type="submit"><i class="ic i-swords btn__espada" aria-hidden="true"></i><span class="btn__rotulo">Entrar</span><i class="ic i-arrow-right" aria-hidden="true"></i><i class="ic i-loader-circle btn__giro" aria-hidden="true"></i></button>
        <p class="portal__nota"><span id="notaModo">Ainda não tem conta?</span> <button type="button" class="portal__modo" id="btnModo">Criar conta</button></p>
      </form>
